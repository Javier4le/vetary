# Vetary — OpenSpec SDD Configuration
# Refreshed: 2026-08-12 (was: 2026-06-03)
# Phase: sdd-init
# Artifact store: hybrid (openspec + engram)

project:
  name: vetary
  description: Multi-tenant SaaS platform for veterinary clinic management
  version: 1.0.0
  repository: vetary

stack:
  backend:
    runtime: Node.js 22
    framework: NestJS 10
    language: TypeScript (strict mode)
    database: PostgreSQL 16 (Docker)
    orm: Prisma 5.8
    auth: JWT with refresh tokens (passport-jwt)
    validation: class-validator + class-transformer
    testing: Jest 29.7

  frontend:
    framework: React 18
    language: TypeScript (strict mode)
    build_tool: Vite
    state_server: TanStack Query v5
    state_client: Zustand
    routing: React Router v6
    ui_styling: Tailwind CSS + shadcn/ui
    forms: React Hook Form + Zod
    testing: Vitest (no test runner installed yet — STACK-react.md only, project scaffold pending)
    status: Not bootstrapped (only STACK-react.md exists)

architecture:
  pattern: Layered Architecture (4 layers)
  layers:
    - presentation: Controllers, Guards, Interceptors
    - application: Services, Use Cases, DTOs
    - domain: Entities, Business Rules, Domain Events
    - infrastructure: Repositories, Prisma, External APIs

  dependency_rule: "Presentation → Application → Domain; Infrastructure → Domain"

  multi_tenancy:
    strategy: Shared database, shared schema with tenantId
    isolation_mechanism: TenantMiddleware + TenantContext (AsyncLocalStorage) + BaseRepository filter
    golden_rule: "No repository can execute a query without the tenantId filter"

testing:
  strict_tdd: true

  backend:
    framework: Jest
    version: 29.7
    test_command: "pnpm --filter vetary-api test"
    watch_command: "pnpm --filter vetary-api test:watch"
    coverage_command: "pnpm --filter vetary-api test:cov"
    e2e_command: "pnpm --filter vetary-api test:e2e"
    test_location: "vetary-api/src/**/*.spec.ts + vetary-api/test/{unit,integration,e2e}/**/*.spec.ts"
    current_test_count: "2026-08-13 — Unit: npx jest => Test Suites: 12 passed, 12 total; Tests: 98 passed, 98 total. E2E: npx jest --config ./test/jest-e2e.json => Test Suites: 2 passed, 2 total; Tests: 8 passed, 8 total."
    e2e_config: test/jest-e2e.json — 2 E2E suites and 8 tests passing (require Postgres via docker-compose)
    migration_status: "2026-08-13 — npx prisma migrate status => 1 migration found in prisma/migrations; Database schema is up to date!"

    test_types:
      - unit: Business logic (services, repositories, middleware, env validation)
      - integration: Repositories with tenant isolation verification (planned)
      - e2e: Critical auth flows (framework configured; 2 suites and 8 tests passing)

    coverage_requirements:
      auth_logic: 100%
      multi_tenant_isolation: 100%
      business_rules: 80%

    strict_tdd_modules:
      - auth
      - tenants
      - repositories
      - bookings
      - services

    standard_mode_allowed:
      - DTOs (validated by class-validator at runtime)
      - Controllers (thin HTTP handlers)
      - Configuration files
      - Database migrations

  frontend:
    framework: Vitest
    test_command: "cd vetary-web && npm run test"
    watch_command: "cd vetary-web && npm run test:watch"
    test_location: "vetary-web/src/**/*.test.tsx"
    status: Not bootstrapped — test runner will be configured when project is scaffolded

    test_types:
      - component: UI logic
      - hook: State management
      - service: API calls (mocked)

strict_tdd_justification: |
  Critical security and isolation requirements:
  1. Authentication logic — password hashing, JWT, refresh tokens, RBAC
     Risk if untested: Unauthorized access, token leakage, privilege escalation
  2. Multi-tenant data isolation — every query MUST filter by tenantId
     Risk if untested: Data leakage between tenants (catastrophic legal/business failure)
  3. Domain state transitions — booking status flow
     Risk if untested: Invalid state transitions, broken business rules

quality:
  linter:
    tool: Biome 1.9 (replaced ESLint — commit d9280eb)
    command: "pnpm --filter vetary-api lint"
    config: "Root biome.json — recommended + strict correctness/suspicious/style rules (noConsole, noDebugger, noExplicitAny: error, useImportType: off, unsafeParameterDecoratorsEnabled for NestJS)"

  type_checker:
    tool: TypeScript 5.3 (tsc)
    command: "pnpm --filter vetary-api exec tsc --noEmit"
    config: vetary-api/tsconfig.json (strict mode, noImplicitAny, noUnusedLocals, noUnusedParameters)

  formatter:
    tool: Biome 1.9 (replaced Prettier — commit d9280eb)
    command: "pnpm --filter vetary-api format"
    biome_config: Root biome.json — indentStyle tab, indentWidth 2, lineWidth 100, organizeImports enabled
    eslint_removal_reason: "ESLint was configured with only eslint:recommended and all TS rules disabled; Biome 1.9 covers 100% of eslint:recommended, unifies lint + format into one tool, and reduces dependencies (see STACK-nestjs.md)"

conventions:
  typescript:
    strict_mode: true
    no_any: true
    explicit_return_types: true

  backend:
    file_naming: kebab-case
    class_naming: PascalCase
    module_structure:
      - dto/
      - entities/
      - repositories/
      - services/
      - controllers/
      - events/ (if applicable)
      - factories/ (if applicable)
      - "[feature].module.ts"

    layer_rules:
      - "Controllers: HTTP only, zero business logic"
      - "Services: orchestrate, never touch Prisma directly"
      - "Repositories: data access only, no business logic"
      - "DTOs: class-validator decorators, validated by global ValidationPipe"
    import_rule: "Never use `import type` on classes with NestJS/class-validator decorators — breaks runtime reflection metadata"
    money_rule: "Money in CLP as Int, never Float"

  project:
    package_manager: "pnpm only — no npm/yarn; packageManager: pnpm@11.5.0 at repo root"
    engine_strict: true (vetary-api/.npmrc)
    alias_imports: "Prefer absolute @/ imports over deep relative paths"
    multi_tenant_golden_rule: "No repository query without tenantId filter"

  frontend:
    structure: Feature-based modules
    layer_separation: "services → hooks → components"
    component_naming: PascalCase
    hook_naming: camelCase with 'use' prefix
    critical_rules:
      - "Never import axios directly — always use shared/lib/apiClient"
      - "Auth interceptor in request (not response), token read dynamically"
      - "TanStack Query for server state, Zustand only for UI state"

  git:
    commit_format: Conventional Commits (feat, fix, chore, docs, refactor, test)
    branch_strategy: "main ← develop ← feature/[name]"
    commit_rule: "One commit per logical unit"
    never_commit:
      - .env
      - credentials
      - node_modules

security_baseline:
  backend_main_ts:
    - Helmet (HTTP security headers)
    - CORS from env var (never '*' in production)
    - Global ValidationPipe with whitelist true, forbidNonWhitelisted true
    - Environment variable validation at startup
    - Swagger/OpenAPI documentation
    - Rate limiting on auth endpoints

  multi_tenant:
    - BaseRepository enforces tenantId filter
    - TenantMiddleware extracts and validates tenant context (AsyncLocalStorage)
    - Integration tests verify cross-tenant queries fail

  auth:
    - Passwords hashed with bcrypt (cost factor ≥10)
    - JWT secret from environment, never hardcoded
    - Refresh token rotation implemented
    - Role-based guards with decorators (@Roles, @CurrentTenant)

design_patterns:
  repository:
    phase: 1
    reason: Isolate Prisma; centralize tenantId filter via BaseRepository
    where: Every module
    status: Implemented (BaseRepository + UserRepository + TenantRepository + ServiceRepository)

  decorator:
    phase: 1
    reason: Auth, roles, tenant metadata on routes
    where: common/decorators
    status: Implemented (@CurrentUser, @Public, @Roles, @CurrentTenant)

  strategy:
    phase: 2
    reason: Availability calculation varies by service type
    where: availability module
    status: Planned

  factory:
    phase: 3
    reason: Creating bookings differs by service type
    where: bookings module
    status: Planned

  observer:
    phase: 3
    reason: Booking state changes trigger multiple actions
    where: bookings module
    status: Planned

phases:
  phase_1:
    name: "Auth + Multi-tenancy Foundation"
    status: COMPLETED (tag fase-1-complete on develop)
    scope:
      - Tenant registration and onboarding (implemented)
      - JWT authentication — login, refresh (implemented, logout/password recovery pending)
      - Role management — SuperAdmin, Admin, Staff, Veterinarian, Client (partially implemented)
      - BaseRepository with tenant isolation (implemented)
      - Auth guards and decorators (implemented)
      - Database schema with multi-tenant foundation (implemented via Prisma)

    acceptance_criteria:
      - A tenant can register and receive their subdomain
      - An admin can log in to their tenant
      - The system rejects tokens from one tenant accessing another tenant's data
      - Role-protected routes work correctly

    strict_tdd_applies_to:
      - Auth service
      - Tenant service
      - BaseRepository
      - Auth guards

    test_status:
      suites: 12 (unit, passing; npx jest, measured 2026-08-13)
      tests: 98 (unit, passing; npx jest, measured 2026-08-13)
      e2e: 2 suites passed, 8 tests passed (npx jest --config ./test/jest-e2e.json, measured 2026-08-13)
      runner: Jest 29.7

  phase_2:
    name: "Clinic Configuration (Services, VetProfiles, Availability)"
    status: In progress (openspec/changes/fase-2-configuracion-clinica/)
    change: fase-2-configuracion-clinica
    delivery_strategy: Chained PRs — feature-branch-chain (PRs target tracker branch; only it merges to main)
    pr_status:
      PR-1: COMPLETED — services module (Service, VetProfile, VetAvailability, Tenant.timezone schema; CRUD + soft-disable + tenant isolation); ~630 lines; 49/49 tests green at merge
      PR-2: PENDING — VetProfileRepository, UserService.createVet() atomic transaction (User + UserTenant + VetProfile), POST /users/vets + /users/staff
      PR-3: PENDING — AvailabilityRepository, AvailabilityService (overlap validation), AvailabilityController, tests + E2E
    business_rules:
      - "Availability: weekly recurring, multi-block per day, one timezone per clinic"
      - "Services: soft-disable (isActive), price CLP Int, unique name per tenant"
      - "Vet creation atomic: User + UserTenant + VetProfile in one Prisma transaction"
      - "Concurrency: single-admin per tenant in v1"

risks:
  tenant_data_leakage:
    impact: Catastrophic (legal, business)
    mitigation: Strict TDD for all repository methods; integration tests verify isolation

  auth_vulnerabilities:
    impact: High (unauthorized access)
    mitigation: Strict TDD for auth flows; manual security review before Phase 1 close

  missing_test_coverage:
    impact: Medium (bugs in production)
    mitigation: Coverage tracking enforced; CI blocks merges below thresholds

  frontend_production_breaks:
    impact: Medium (user-facing failures)
    mitigation: apiClient configuration enforced; auth interceptor tested

  state_explosion:
    impact: Low (complexity creep)
    mitigation: TanStack Query for server state only; Zustand minimal

teaching_level: principiante

artifacts_store:
