# 🏗️ ARQUITECTURA: Docker Compose para desarrollo local
# PostgreSQL 16 + Adminer para gestión visual de la base de datos
# Asegura que todos los desarrolladores tengan el mismo ambiente

version: '3.8'

services:
  # PostgreSQL 16 — Base de datos principal
  postgres:
    image: postgres:16-alpine
    container_name: vetary_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vetary_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer — Interfaz web para gestionar PostgreSQL
  # Accesible en http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: vetary_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
    driver: local
